<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR 가벽 배치 테스트</title>
  <meta itemprop="name" content="AR 가벽 배치 테스트">
  <meta name="twitter:title" content="AR 가벽 배치 테스트">
  <meta property="og:title" content="AR 가벽 배치 테스트">
  <meta property="og:site_name" content="AR 가벽 배치 테스트">
  <meta name="description" content="실제 크기의 테스트용 가벽을 바닥에 배치하는 AR 테스트입니다.">
  <meta itemprop="description" content="실제 크기의 테스트용 가벽을 바닥에 배치하는 AR 테스트입니다.">
  <meta property="og:description" content="실제 크기의 테스트용 가벽을 바닥에 배치하는 AR 테스트입니다.">
  <meta name="twitter:description" content="실제 크기의 테스트용 가벽을 바닥에 배치하는 AR 테스트입니다.">

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/coaching-overlay@1/dist/coaching-overlay.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" async="true" data-preload-chunks="slam"></script>

</head>

<body>
<script src="bundle.js"></script>
<!-- Copyright (c) 2022 8th Wall, Inc. -->
<!-- body.html is optional; elements will be added to your html body after app.js is loaded. -->

<div id="cameraLoadingOverlay" role="status" aria-live="polite">
  <span>카메라 준비 중...</span>
</div>

<div class="over">
  <span id="promptText">바닥을 터치해 가벽을 배치하세요</span>
</div>

<!-- Add the tap-place component to the scene so it has an effect -->
<a-scene
  tap-place
  landing-page
  coaching-overlay="promptText: 휴대폰을 앞으로 밀었다가 다시 당겨 주세요;"
  xrextras-runtime-error
  renderer="colorManagement:true"
  xrweb="
    allowedDevices: any;
    scale: absolute;
    defaultEnvironmentFogIntensity: 0.5; 
    defaultEnvironmentFloorTexture: #groundTex; 
    defaultEnvironmentFloorColor: #FFF;
    defaultEnvironmentSkyBottomColor: #B4C4CC; 
    defaultEnvironmentSkyTopColor: #5ac8fa;
    defaultEnvironmentSkyGradientStrength: 0.5;">

  <!-- We can define assets here to be loaded when A-Frame initializes -->
  <a-assets>
    <img id="groundTex" src="assets/sand.jpg">
  </a-assets>

  <!-- The raycaster will emit mouse events on scene objects specified with the cantap class -->
  <a-camera
    id="camera"
    position="0 8 8"
    raycaster="objects: .cantap"
    cursor="
      fuse: false;
      rayOrigin: mouse;">
  </a-camera>

  <a-entity
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight:2048;
      shadowMapWidth:2048;
      shadowCameraTop: 40;
      shadowCameraBottom: -40;
      shadowCameraRight: 40;
      shadowCameraLeft: -40;
      target: #camera"
    xrextras-attach="target: camera; offset: 8 15 4"
    position="1 4.3 2.5"
    shadow>
  </a-entity>

  <a-light type="ambient" intensity="0.5"></a-light>

  <!-- Adding the cantap class allows the ground to be clicked -->
  <a-box
    id="ground"
    class="cantap"
    scale="1000 2 1000"
    position="0 -0.99 0"
    material="shader: shadow; transparent: true; opacity: 0.4"
    shadow>
  </a-box>
</a-scene>

</body>

</html>
